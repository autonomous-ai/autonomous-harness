<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World · OpenHarness</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8f6; color: #132b22; }
  main { max-width: 36rem; padding: 3rem; }
  .eyebrow { color: #287350; font-size: .75rem; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; }
  h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.05; letter-spacing: -.055em; font-weight: 600; margin: 1rem 0 1.5rem; overflow-wrap: anywhere; }
  p { line-height: 1.6; color: #53685e; }
  @media (prefers-color-scheme: dark) {
    body { background: #112019; color: #e8f5ec; }
    .eyebrow { color: #80dbaa; } p { color: #a0b8aa; }
  }
</style>
<main>
  <div class="eyebrow">Your first OpenHarness</div>
  <h1>Hello, world!</h1>
  <p>Ask the agent to say hello to you. Then make this page your own.</p>
</main>
</html>
