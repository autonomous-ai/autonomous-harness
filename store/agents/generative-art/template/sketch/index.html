<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Generative Art</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0b12}canvas{display:block}</style>
</head>
<body>
<script>
// Placeholder: a seeded frame so the pane shows the piece live before the agent tunes it.
const canvas = document.body.appendChild(document.createElement('canvas'))
const g = canvas.getContext('2d')
function size(){ canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0) }
size(); addEventListener('resize', size)
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) } return h >>> 0 }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const seed = new URLSearchParams(location.search).get('seed') || '1'
const rnd = mulberry32(hash(seed))
const hue = rnd() * 360
function frame(){
  const w = canvas.width / devicePixelRatio, h = canvas.height / devicePixelRatio
  const grad = g.createLinearGradient(0, 0, 0, h)
  grad.addColorStop(0, `hsl(${hue} 70% 8%)`); grad.addColorStop(1, `hsl(${(hue+40)%360} 60% 20%)`)
  g.fillStyle = grad; g.fillRect(0, 0, w, h)
  for (let i = 0; i < 40; i++){
    const x = rnd()*w, y = rnd()*h, r = rnd()*w*0.03
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2)
    g.fillStyle = `hsla(${(hue+i*3)%360} 80% 60% ${0.05+rnd()*0.2})`; g.fill()
  }
  requestAnimationFrame(frame)
}
frame()
// Re-seed on ?seed= change (the pane may reload the URL)
addEventListener('hashchange', () => location.reload())
</script>
</body>
</html>
