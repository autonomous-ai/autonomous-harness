<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Direction — seeded placeholder</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; background: #101014; color: #ececf0; }
  .board { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
  .tag { font: 11px ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase;
         opacity: .55; margin-bottom: 8px; }
  h1 { font-size: 44px; line-height: 1.04; margin: 0 0 28px; font-weight: 750; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
  .sw { flex: 1 1 140px; height: 92px; border-radius: 10px; display: grid; place-items: center;
        font: 12px ui-monospace, monospace; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .spec { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .card { border: 1px solid #ffffff22; border-radius: 12px; padding: 16px 18px; background: #ffffff0a; }
  .card h3 { margin: 0 0 8px; font-size: 13px; opacity: .6; font-weight: 600; }
  .card p { margin: 0; font-size: 16px; line-height: 1.4; }
  .rationale { margin-top: 28px; font-size: 14px; line-height: 1.6; opacity: .78; max-width: 62ch; }
</style>
<div class="board">
  <div class="tag">Moodboard · seed <span id="seed"></span> · placeholder</div>
  <h1 id="title">A real seeded direction will land here</h1>
  <div class="row" id="swatches"></div>
  <div class="spec" id="spec"></div>
  <p class="rationale" id="rationale">The first seed above is a seeded demo. Describe a
     look-and-feel — an editorial calm, a brutalist punch — and the agent will derive a full
     palette, type pairing and layout direction, all re-seedable.</p>
</div>
<script>
  // Seeded PRNG (mulberry32) derived from ?seed= so the placeholder is deterministic.
  const seedStr = new URLSearchParams(location.search).get('seed') || '0';
  document.querySelector('#seed').textContent = seedStr;
  const mulberry32 = (a) => () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  const rnd = mulberry32(h >>> 0);
  const hue = Math.floor(rnd() * 360);
  const swatches = document.querySelector('#swatches');
  for (let i = 0; i < 5; i++) {
    const h2 = (hue + Math.floor(rnd() * 60)) % 360;
    const sat = 55 + Math.floor(rnd() * 30);
    const lig = 30 + Math.floor(rnd() * 50);
    const el = document.createElement('span');
    el.className = 'sw';
    el.style.background = `hsl(${h2} ${sat}% ${lig}%)`;
    el.textContent = `hsl(${h2} ${sat}% ${lig}%)`;
    swatches.appendChild(el);
  }
  const spec = document.querySelector('#spec');
  const ks = [['Display', 'Serif / Grotesk pairing'], ['Body', '12-16px with 1.6 leading'], ['Mood', rnd() > .5 ? 'Calm / editorial' : 'Bold / high-contrast']];
  for (const [k, v] of ks) {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<h3>${k}</h3><p>${v}</p>`;
    spec.appendChild(c);
  }
</script>
</html>
