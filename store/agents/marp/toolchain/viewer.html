<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marp</title>
<style>
  :root { color-scheme: dark; --bg: #141414; --fg: #d8d8d8; --muted: #8a8a8a; --line: #2a2a2a; --ok: #6cc177; --err: #e06c6c; --warn: #d9a441; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  #bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: rgba(20,20,20,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  #bar .count { font-weight: 600; }
  #bar .state { color: var(--muted); }
  #bar .state.ok { color: var(--ok); } #bar .state.err { color: var(--err); } #bar .state.warn { color: var(--warn); }
  #bar .spacer { flex: 1; } #bar .deck { color: var(--muted); font-variant-numeric: tabular-nums; }
  #stack { padding: 16px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .slide { position: relative; width: 100%; max-width: 1280px; }
  .slide .n { position: absolute; left: 0; top: -2px; transform: translateY(-100%); color: var(--muted); font-size: 11px; }
  .slide .frame { width: 100%; overflow: hidden; border-radius: 6px; box-shadow: 0 2px 14px rgba(0,0,0,.5); background: #fff; }
  /* marp-core sizes each slide's <svg> for a full window (100vw x 100vh); here it fills its frame. */
  .slide .frame .marpit > svg[data-marpit-svg] { display: block !important; width: 100% !important; height: auto !important; }
  .slide.flagged .frame { outline: 2px solid var(--warn); }
  .slide.broken .frame { outline: 2px solid var(--err); }
  .note { margin: 6px 2px 0; color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  #empty { padding: 48px 24px; color: var(--muted); text-align: center; }
  #findings { padding: 0 16px 24px; max-width: 1280px; margin: 0 auto; }
  #bar button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 10px; font: inherit; cursor: pointer; }
  #bar button:hover { border-color: var(--muted); }
  /* present: one slide, the whole pane, arrow keys */
  body.present #bar, body.present #findings { display: none; }
  body.present #stack { padding: 0; gap: 0; height: 100vh; justify-content: center; background: #000; }
  body.present .slide { display: none; max-width: none; }
  body.present .slide.current { display: block; width: min(100vw, calc(100vh * 16 / 9)); }
  body.present .slide .n, body.present .note { display: none; }
  body.present .slide .frame { border-radius: 0; box-shadow: none; }
  #findings div { padding: 4px 0; color: var(--muted); } #findings .error { color: var(--err); } #findings .warning { color: var(--warn); }
</style>
</head>
<body>
<div id="bar"><span class="count" id="count">…</span><span class="state" id="state"></span><span class="spacer"></span><span class="deck" id="deck"></span><button id="present" title="Present (P) — arrow keys, Esc to leave">Present</button></div>
<style id="deckcss"></style>
<div id="stack"></div>
<div id="findings"></div>
<script src="/marp-browser.js"></script>
<script>
  const file = new URLSearchParams(location.search).get('file') || 'deck.md';
  const stack = document.getElementById('stack'), css = document.getElementById('deckcss');
  const count = document.getElementById('count'), state = document.getElementById('state'), deckEl = document.getElementById('deck'), findings = document.getElementById('findings');
  deckEl.textContent = file;
  let lastHtml = null;
  async function load() {
    let d;
    try { d = await (await fetch('/deck.json?file=' + encodeURIComponent(file), { cache: 'no-store' })).json(); }
    catch (e) { state.textContent = 'viewer unreachable'; state.className = 'state err'; return; }
    if (d.error) { count.textContent = ''; state.textContent = d.error; state.className = 'state err'; return; }
    if (d.missing) { count.textContent = '0 slides'; state.textContent = file + ' is not written yet'; state.className = 'state'; stack.innerHTML = '<div id="empty">The deck appears here as it is written.</div>'; return; }
    const v = d.verdict || { summary: 'not the deck: shown, not judged' }; const errs = (v.findings || []).filter(f => f.severity === 'error').length, warns = (v.findings || []).filter(f => f.severity === 'warning').length;
    count.textContent = d.slides.length + (d.slides.length === 1 ? ' slide' : ' slides');
    state.textContent = v.summary || ''; state.className = 'state ' + (errs ? 'err' : v.ready ? 'ok' : warns ? 'warn' : '');
    const key = JSON.stringify(d.html) + d.css;
    if (key !== lastHtml) {
      lastHtml = key; css.textContent = d.css;
      const flagged = new Map(); for (const f of v.findings || []) { const m = /^slide (\d+)$/.exec(f.ref || ''); if (m) flagged.set(+m[1], f.severity === 'error' ? 'broken' : 'flagged'); }
      const y = window.scrollY;
      stack.innerHTML = d.html.map((h, i) => {
        const s = d.slides[i] || {}; const cls = flagged.get(i + 1) || '';
        return '<div class="slide ' + cls + '"><div class="n">' + (i + 1) + (s.title ? ' · ' + s.title.replace(/</g, '&lt;') : '') + '</div><div class="frame"><div class="marpit">' + h + '</div></div>' + (s.notes ? '<div class="note">' + s.notes.replace(/</g, '&lt;') + '</div>' : '') + '</div>';
      }).join('');
      window.scrollTo(0, y);
    }
    findings.innerHTML = (v.findings || []).map(f => '<div class="' + f.severity + '">' + f.severity + ' · ' + String(f.message).replace(/</g, '&lt;') + '</div>').join('');
  }
  // Present: one slide at a time, the size of the pane. Zoom the pane and it is the talk.
  let current = 0;
  function show(i) {
    const slides = [...stack.querySelectorAll('.slide')]; if (!slides.length) return;
    current = Math.max(0, Math.min(i, slides.length - 1));
    slides.forEach((s, j) => s.classList.toggle('current', j === current));
  }
  function present(on) {
    document.body.classList.toggle('present', on);
    if (on) show(current); else window.scrollTo(0, stack.querySelectorAll('.slide')[current]?.offsetTop ?? 0);
  }
  document.getElementById('present').addEventListener('click', () => present(true));
  document.addEventListener('keydown', (e) => {
    const on = document.body.classList.contains('present');
    if (!on && (e.key === 'p' || e.key === 'P')) { present(true); e.preventDefault(); return; }
    if (!on) return;
    if (e.key === 'Escape') { present(false); }
    else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'ArrowDown' || e.key === 'PageDown') { show(current + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { show(current - 1); e.preventDefault(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(1e9);
  });
  stack.addEventListener('click', (e) => { if (document.body.classList.contains('present')) show(current + 1); });
  new EventSource('/events').addEventListener('change', async () => { await load(); if (document.body.classList.contains('present')) show(current); });
  // `#present` opens straight into the talk (a link from the pane header, or a second window).
  load().then(() => { if (location.hash === '#present') present(true); });
</script>
</body>
</html>
