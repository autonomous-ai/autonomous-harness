<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Bench — seeded placeholder</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: linear-gradient(160deg, #10201c, #070d0b); color: #dfefe8;
         font-family: ui-monospace, Menlo, monospace; }
  canvas { width: min(90vw, 680px); height: auto; aspect-ratio: 4/3; background: #0b1411;
           border: 1px solid #1e332b; border-radius: 10px; }
  .card { text-align: center; padding: 20px; max-width: 720px; }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: .02em; }
  p { opacity: .7; line-height: 1.6; margin: 0 0 14px; }
  .hint { opacity: .55; font-size: 12px; margin-top: 10px; }
</style>
<div class="card">
  <h1>Lab Bench · placeholder</h1>
  <p>A real, probeable dataset will render here. This placeholder is a seeded scatter
     — two groups pushed along a mild trend with noise, a trendline over the points.
     Confirm the axes, points and line read cleanly, then replace it.</p>
  <canvas id="c" width="680" height="510"></canvas>
  <div class="hint">re-seed with ?seed=…</div>
</div>
<script>
  // Seeded PRNG (mulberry32) so the placeholder is deterministic.
  const seed = () => {
    const s = new URLSearchParams(location.search).get('seed') || '0';
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  const mulberry32 = (a) => () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rnd = mulberry32(seed());
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 680, H = 510, M = 46;
  // seeded data: two groups, mild upward trend, noise
  const pts = [];
  for (let i = 0; i < 90; i++) {
    const g = (i % 2);
    const x = i / 89;
    const y = Math.max(0, Math.min(1, x * .7 + (g ? .06 : 0) + (rnd() * 0.24 - 0.04)));
    pts.push({ x, y, g });
  }
  const draw = () => {
    ctx.fillStyle = '#0b1411'; ctx.fillRect(0, 0, W, H);
    const px = v => M + v * (W - 2 * M), py = v => H - M - v * (H - 2 * M);
    // grid + axes
    ctx.strokeStyle = 'rgba(140,200,175,0.18)';
    for (let i = 0; i <= 4; i++) {
      ctx.beginPath(); ctx.moveTo(px(i / 4), py(0)); ctx.lineTo(px(i / 4), py(1)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0), py(i / 4)); ctx.lineTo(px(1), py(i / 4)); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(180,230,205,0.6)';
    ctx.beginPath(); ctx.moveTo(px(0), py(0)); ctx.lineTo(px(1), py(0));
    ctx.moveTo(px(0), py(0)); ctx.lineTo(px(0), py(1)); ctx.stroke();
    // trendline
    ctx.strokeStyle = '#67e0a8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px(0), py(0.28)); ctx.lineTo(px(1), py(0.72)); ctx.stroke();
    ctx.lineWidth = 1;
    // points
    for (const p of pts) {
      ctx.fillStyle = p.g ? '#ffd27c' : '#6fd6ff';
      ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#dfefe8';
    ctx.font = '13px ui-monospace, Menlo, monospace';
    ctx.fillText('x', W - M + 14, py(0) + 4);
    ctx.fillText('y', M, M - 14);
  };
  draw();
</script>
</html>
