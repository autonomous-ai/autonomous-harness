<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Studio — seeded placeholder</title>
<style>
  :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: linear-gradient(160deg, #16132b, #0c0a18); color: #eee;
         font-family: ui-monospace, Menlo, monospace; }
  .card { text-align: center; padding: 40px; max-width: 560px; }
  h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: .02em; }
  p { opacity: .7; line-height: 1.6; margin: 0 0 20px; }
  #replay { padding: 10px 20px; border-radius: 8px; border: 0; cursor: pointer;
            font: inherit; color: #0c0a18; background: #7c5cff; font-weight: 650; }
</style>
<div class="card">
  <h1>Music Studio · placeholder</h1>
  <p>A real, seedable track will play here. This placeholder is a short seeded loop:
     four kick hits and a rising arpeggio on the low A — confirm audio, then replace it.</p>
  <button id="replay">Play seed</button>
</div>
<script>
  // Seeded PRNG (mulberry32) so the placeholder is deterministic.
  const seed = () => {
    const s = new URLSearchParams(location.search).get('seed') || '0';
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  const mulberry32 = (a) => () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let ctx;
  const rnd = mulberry32(seed());
  const play = () => {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    // a low kick at the start of each bar, four bars
    for (let b = 0; b < 4; b++) {
      const t = now + b;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 55;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.45);
      // a drifting note from the seeded rng
      const note = 220 * Math.pow(2, Math.floor(rnd() * 7) / 12);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.frequency.value = note;
      g2.gain.setValueAtTime(0.0001, t + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.2, t + 0.06);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o2.connect(g2).connect(ctx.destination);
      o2.start(t + 0.05); o2.stop(t + 0.55);
    }
  };
  document.querySelector('#replay').addEventListener('click', play);
</script>
</html>
