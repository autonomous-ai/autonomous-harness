// Shared deterministic primitives. Domain models use named streams so unrelated edits stay stable.
function hash(value) {
  let h = 2166136261;
  for (const c of String(value)) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return h >>> 0;
}
function random(seed, stream = "main") {
  let a = hash(`${seed}:${stream}`);
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const lerp = (a, b, t) => a + (b - a) * t;

function normal(rng) {

    Math.sqrt(-2 * Math.log(Math.max(1e-9, rng()))) *
    Math.cos(2 * Math.PI * rng())
  );

const blockTypes = [
  null,
  { name: "Grass", color: [0.4, 0.58, 0.31] },
  { name: "Earth", color: [0.48, 0.34, 0.23] },
  { name: "Stone", color: [0.51, 0.55, 0.53] },
  { name: "Sand", color: [0.81, 0.74, 0.54] },
  { name: "Timber", color: [0.43, 0.29, 0.17] },
  { name: "Canopy", color: [0.25, 0.47, 0.27] },
  { name: "Water", color: [0.24, 0.52, 0.59] },
  { name: "Cedar", color: [0.68, 0.46, 0.28] },
  { name: "Lantern", color: [1, 0.74, 0.32] },

function blockAt(world, x, y, z) {
  if (x < 0 || y < 0 || z < 0 || x >= world.w || y >= world.h || z >= world.d)
    return 0;
  return world.blocks[(y * world.d + z) * world.w + x];
}
function putBlock(world, x, y, z, id) {
  if (x < 0 || y < 0 || z < 0 || x >= world.w || y >= world.h || z >= world.d)
    return false;
  world.blocks[(y * world.d + z) * world.w + x] = id;

  return id !== 0 && id !== 7;

  for (let y = world.h - 1; y >= 0; y--)
    if (solidBlock(blockAt(world, Math.floor(x), y, Math.floor(z))))
      return y + 1;

function voxelWorld(seed) {
  const world = {
      seed: String(seed),
      w: 48,
      h: 28,
      d: 48,
      blocks: new Uint8Array(48 * 28 * 48),
    },
    r = random(seed, "terrain"),
    phase = r() * 6.28,
    phase2 = r() * 6.28;

    for (let x = 0; x < world.w; x++) {
      const radius = Math.hypot((x - 24) / 25, (z - 24) / 26);
      let height = clamp(
        Math.floor(
          5 +
            (1 - radius) * 9 +
            Math.sin(x * 0.23 + phase) * 1.6 +
            Math.cos(z * 0.24 + phase2) * 1.6,
        ),
        2,
        15,
      );

          world,
          x,
          y,
          z,

    for (let z = cz - radius; z <= cz + radius; z++)

  const spawnHeight = Math.max(8, groundAt(world, 31, 35));
  pad(31, 35, 3, spawnHeight);
  const hutHeight = Math.max(8, groundAt(world, 31, 25));
  pad(31, 25, 4, hutHeight);

          forward:
            (keys.w || keys.arrowup ? 1 : 0) -
            (keys.s || keys.arrowdown ? 1 : 0),
          right:
            (keys.d || keys.arrowright ? 1 : 0) -
            (keys.a || keys.arrowleft ? 1 : 0),
          jump: keys[" "],
          sprint: keys.shift,
        });
        worldAccum -= 1 / 60;
      }
    }
    if (cycling) {
      timeOfDay = (timeOfDay + delta / 240) % 1;
      $("#daylight").value = timeOfDay * 100;
    }
    if (
      worldDirty ||
      cycling ||
      Math.hypot(
        player.x - before.x,
        player.y - before.y,
        player.z - before.z,
      ) > 0.0001
    ) {
      drawWorld();
      worldDirty = false;
    }
  }
  requestAnimationFrame(worldFrame);
}
try {
  initGL();
  newWorld();
  fitCanvas(canvas, drawWorld, 1.5);
  addEventListener("seedchange", newWorld);
  requestAnimationFrame(worldFrame);
  ready();
} catch (error) {
  $("#world-error").hidden = false;
  $("#world-error").textContent = error.message;
  parentMessage({ type: "harness:error", message: error.message });
}

$("#import-world").onclick = () => $("#world-file").click();
$("#world-file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    if (file.size > 2 * 1024 * 1024)
      throw new Error("Choose a Tidelands JSON file smaller than 2 MiB.");
    const restored = importWorld(JSON.parse(await file.text()));
    setSeed(restored.world.seed);
    world = restored.world;
    player = restored.player;
    timeOfDay = restored.timeOfDay;
    $("#daylight").value = timeOfDay * 100;
    edited = 0;
    meshWorld();
    drawWorld();
    toast("Your world is restored.");
  } catch (error) {
    toast(error.message);
  } finally {
    e.target.value = "";
  }
};

</script></body></html>
