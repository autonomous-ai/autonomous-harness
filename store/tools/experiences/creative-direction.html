<section class="intro">
  <div>
    <p class="eyebrow">Independent identities / Direction 01—03</p>
    <h1>An identity.<br />A point of view.</h1>
  </div>
  <div class="actions">
    <button id="tokens">Export tokens</button
    ><button id="poster-export" class="primary">Export poster ↗</button>
  </div>
</section>
<main class="direction-layout">
  <nav class="direction-nav" id="directions" aria-label="Art direction"></nav>
  <div class="brand-grid">
    <section id="poster" class="poster" aria-label="Brand poster"></section>
    <aside class="brand-details">
      <p class="eyebrow" id="direction-name"></p>
      <h2 id="direction-line"></h2>
      <p id="rationale" class="muted"></p>
      <label class="field"
        ><span>Your name on it</span
        ><input id="brand-name" maxlength="28" aria-label="Brand name"
      /></label>
      <div class="palette-head">
        <h3>The palette</h3>
        <button id="lock-palette" aria-pressed="false">Lock palette</button>
      </div>
      <div id="swatches" class="swatches"></div>
      <p class="small muted" id="contrast"></p>
      <div class="type-spec">
        <p class="eyebrow">Type in context</p>
        <p class="specimen" id="type-specimen">Aa Bb Cc<br />0123456789</p>
        <span class="small muted" id="type-name"></span>
      </div>
      <div class="brand-card" id="brand-card">
        <span class="eyebrow">The small things matter</span>
        <h3 id="card-name"></h3>
        <span>Objects. Places. Possibilities.</span>
      </div>
    </aside>
  </div>
  <div class="direction-foot">
    <p class="eyebrow" id="mood"></p>
    <p class="small muted">
      A working identity: a poster, a type system, a palette and the reasoning
      behind them.
    </p>
  </div>
</main>
