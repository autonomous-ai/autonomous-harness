<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Viewer</title>
<style>
  :root { color-scheme: light dark; font: 12px system-ui, sans-serif; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: light-dark(#f4f4f4, #252525); }
  #file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { margin-left: auto; opacity: .65; white-space: nowrap; }
  button { color: inherit; background: transparent; border: 1px solid #8886; border-radius: 5px; padding: 4px 8px; cursor: pointer; }
  button:hover { background: #8882; }
  iframe { width: 100%; flex: 1; min-height: 0; border: 0; }
</style>
<header><span id="file"></span><span id="status" role="status">Connecting…</span><button id="reload">Reload</button></header>
<iframe id="preview" title="Workspace preview" sandbox="allow-scripts"></iframe>
<script>
  const requested = new URLSearchParams(location.search).get('file') || 'index.html';
  const parts = requested.split(/[\\/]/);
  const file = parts.some(part => !part || part.startsWith('.')) ? 'index.html' : requested;
  const frame = document.querySelector('#preview');
  const status = document.querySelector('#status');
  document.querySelector('#file').textContent = file;
  const reload = () => { frame.src = '/files/' + file.split('/').map(encodeURIComponent).join('/') + '?v=' + Date.now(); };
  document.querySelector('#reload').addEventListener('click', reload);
  reload();
  const events = new EventSource('/events');
  events.onopen = () => { status.textContent = 'Live'; reload(); };
  events.onerror = () => { status.textContent = 'Reconnecting…'; };
  events.addEventListener('change', reload);
  events.addEventListener('watch-error', () => { status.textContent = 'Use Reload to see changes'; });
</script>
</html>
